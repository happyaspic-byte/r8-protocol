[package]
name = "r8-session"
description = "Strict R8 v0.1 session security for a private experimental closed lab"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
subtle = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
r8-proto = { path = "../r8-proto" }
getrandom = "0.2"
libc = "0.2"
[[bin]]
name = "r8session"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1"
