[package]
name = "r8-mobility"
description = "Strict R8 candidate binding and mobility controls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "r8move"
path = "src/main.rs"
[dependencies]
ed25519-dalek = "2"
aws-lc-rs = "1"
zeroize = "1"
r8-session = { path = "../r8-session" }
getrandom = "0.2"
libc = "0.2"
r8-proto = { path = "../r8-proto" }

[dev-dependencies]
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
