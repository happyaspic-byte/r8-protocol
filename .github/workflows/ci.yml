name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install pinned tshark and Q1 prerequisites
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes tshark=4.6.4-1 iproute2 arping ethtool
          tshark --version | grep -F "TShark (Wireshark) 4.6.4"
          tshark -G fields >/dev/null
      - name: Install development requirements
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Python, vector, schema, digest, and mandatory dissector tests
        env:
          R8_REQUIRE_TSHARK: "1"
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Session fuzz smoke
        run: python3 tests/fuzz_session.py
      - name: Mobility fuzz smoke
        run: python3 tests/fuzz_mobility.py
      - name: Privileged Q1 closed-lab smoke
        run: |
          SOURCE_IDENTITY="$(python3 bench/q1.py source-identity)"
          sudo -E env PATH="$PATH" GITHUB_SHA="$GITHUB_SHA" python3 bench/q1.py run --smoke --output "$RUNNER_TEMP/q1-smoke" --source-identity "$SOURCE_IDENTITY" --git-commit "$GITHUB_SHA" --host-epoch ci-q1-smoke
          sudo -E env PATH="$PATH" GITHUB_SHA="$GITHUB_SHA" python3 bench/q1.py regenerate --output "$RUNNER_TEMP/q1-smoke"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/q1-smoke"
      - name: Validate Q1 smoke rows
        run: |
          python3 -c 'import json, os, pathlib; output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "q1-smoke"; rows = json.loads((output / "raw.json").read_text()); smoke = json.loads((output / "smoke_non_result.json").read_text()); eligible = json.loads((output / "publication_eligible.json").read_text()); completeness = ("evidence_complete", "cleanup_complete", "cpu_complete", "counter_complete", "environment_complete", "topology_complete"); counts = ("scheduled_payloads", "attempted_payloads", "sent_payloads", "received_payloads"); topology = {"namespace_count": 3, "interface_count": 10, "non_loopback_interface_count": 7, "veth_pair_count": 3}; proof = lambda row: set(row["interface_counter_timestamp_ns_by_ordinal"]) == {"pre", "activation", "post"} and row["interface_counter_timestamp_ns_by_ordinal"]["pre"] <= row["t_minus_3_ns"] <= row["interface_counter_timestamp_ns_by_ordinal"]["pre"] + 100000000 and abs(row["interface_counter_timestamp_ns_by_ordinal"]["activation"] - row["cutover_ns"]) <= 100000000 and row["observation_end_ns"] <= row["interface_counter_timestamp_ns_by_ordinal"]["post"] <= row["observation_end_ns"] + 100000000 and set(row["process_cpu_timestamp_ns_by_ordinal"]) == {"endpoint_0", "endpoint_1", "parent"} and all(value["pre"] <= row["t_minus_3_ns"] and value["post"] >= row["observation_end_ns"] for value in row["process_cpu_timestamp_ns_by_ordinal"].values()); assert len(rows) == 6 and smoke is True and eligible is True; assert all(row["setup_status"] == "complete" and row["error_category"] is None and row["failure"] is False and row["readiness_ns"] is not None and all(row[field] is True for field in completeness) and all(type(row[field]) is int for field in counts) and 0 <= row["sent_payloads"] <= row["attempted_payloads"] <= row["scheduled_payloads"] == 800 and row["received_payloads"] >= 0 and set(row["interface_counter_by_ordinal"]) == {"pre", "activation", "post"} and all(row["interface_counter_by_ordinal"][key] for key in ("pre", "activation", "post")) and proof(row) and all(row[field] == value for field, value in topology.items()) for row in rows)'
      - name: Upload Q1 smoke package
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: q1-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/q1-smoke
          if-no-files-found: warn
          retention-days: 7
      - name: Q3 closed-lab smoke
        run: |
          PYTHON_BIN="$(command -v python3)"
          SOURCE_IDENTITY=ci-smoke-non-result
          HOST_EPOCH=ci-non-result
          sudo env PATH="$PATH" PYTHON_BIN="$PYTHON_BIN" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" SOURCE_IDENTITY="$SOURCE_IDENTITY" HOST_EPOCH="$HOST_EPOCH" Q3_ISOLATED_NETNS=1 unshare --net --mount-proc bash -ceu 'ip link set lo up; "$PYTHON_BIN" bench/q3.py run --smoke --output "$RUNNER_TEMP/q3-smoke" --source-identity "$SOURCE_IDENTITY" --host-epoch "$HOST_EPOCH"; "$PYTHON_BIN" bench/q3.py regenerate --output "$RUNNER_TEMP/q3-smoke"'
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/q3-smoke"
      - name: Validate Q3 smoke raw rows
        run: |
          PYTHON_BIN="$(command -v python3)"
          "$PYTHON_BIN" -c 'import json, os, pathlib; output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "q3-smoke"; manifest = json.loads((output / "run-manifest.json").read_text()); environment = json.loads((output / "environment.json").read_text()); rows = [json.loads(line) for line in (output / "raw.jsonl").read_text().splitlines()]; assert len(rows) == 8 and manifest["isolated_netns_proof"] is True and environment["isolated_netns_proof"] is True; assert all(row["status"] == "success" and row["smoke_non_result"] is True and row["source_identity"] == "ci-smoke-non-result" and row["host_epoch"] == "ci-non-result" and row["network"]["rx_bytes"] == row["network"]["tx_bytes"] and row["network"]["rx_packets"] == row["network"]["tx_packets"] for row in rows)'

  fuzz-smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install development requirements
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Parser fuzz smoke
        run: python3 tests/fuzz_reference.py

  rust:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Rust formatting
        working-directory: rust
        run: cargo fmt --all --check
      - name: Rust lint
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust workspace tests
        working-directory: rust
        run: cargo test --workspace --locked
      - name: Build r8-session
        working-directory: rust
        run: cargo build -p r8-session --locked
      - name: Build r8-mobility
        working-directory: rust
        run: cargo build -p r8-mobility --locked

  interop:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install development requirements
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Build session and mobility interoperability binaries
        working-directory: rust
        run: cargo build -p r8-session -p r8-mobility --locked
      - name: Python and Rust UDP interoperability
        run: python3 tests/interop.py --build
      - name: Python and Rust session interoperability
        run: python3 tests/session_interop.py --build
      - name: Python and Rust mobility interoperability
        run: python3 tests/mobility_interop.py
