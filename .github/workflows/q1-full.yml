name: Q1 Full

on:
  workflow_dispatch:
    inputs:
      host_epoch:
        description: Opaque host-epoch label for this closed-lab run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: q1-full-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  q1-full:
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install Q1 prerequisites
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes iproute2 arping ethtool
          python3 -m pip install --requirement requirements-dev.txt
      - name: Build native r8move
        working-directory: rust
        run: cargo build -p r8-mobility --locked
      - name: Q1 preflight
        run: sudo -E env PATH="$PATH" python3 bench/q1.py preflight > "$RUNNER_TEMP/q1-preflight.json"
      - name: Execute full closed-lab Q1 package
        env:
          HOST_EPOCH: ${{ inputs.host_epoch }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
          SOURCE_IDENTITY="$(python3 bench/q1.py source-identity)"
          sudo -E env PATH="$PATH" GITHUB_SHA="$GITHUB_SHA" Q1_CLEAN_TREE=true python3 bench/q1.py run --output "$RUNNER_TEMP/q1-full" --source-identity "$SOURCE_IDENTITY" --git-commit "$GITHUB_SHA" --host-epoch "$HOST_EPOCH"
          sudo -E env PATH="$PATH" GITHUB_SHA="$GITHUB_SHA" Q1_CLEAN_TREE=true python3 bench/q1.py regenerate --output "$RUNNER_TEMP/q1-full"
      - name: Restore full Q1 package ownership
        if: always()
        run: |
          if [ -e "$RUNNER_TEMP/q1-full" ]; then sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/q1-full"; sudo chmod -R u+rwX "$RUNNER_TEMP/q1-full"; fi
      - name: Validate full Q1 package
        env:
          HOST_EPOCH: ${{ inputs.host_epoch }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 -c 'import hashlib, json, os, pathlib, runpy; output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "q1-full"; contract = runpy.run_path("bench/q1.py"); manifest = json.loads((output / "manifest.json").read_text()); environment = json.loads((output / "environment.json").read_text()); eligible = json.loads((output / "publication_eligible.json").read_text()); rows = json.loads((output / "raw.json").read_text()); summary = json.loads((output / "summary.json").read_text()); planned = {item["trial_id"]: item for item in contract["schedule"]()}; required = set(contract["RAW_FIELDS"]); categories = contract["ERROR_CATEGORIES"]; completeness = ("evidence_complete", "cleanup_complete", "cpu_complete", "counter_complete", "environment_complete", "topology_complete"); counts = ("scheduled_payloads", "attempted_payloads", "sent_payloads", "received_payloads"); topology = {"namespace_count": 3, "interface_count": 10, "non_loopback_interface_count": 7, "veth_pair_count": 3}; proof = lambda row: set(row["interface_counter_timestamp_ns_by_ordinal"]) == {"pre", "activation", "post"} and row["interface_counter_timestamp_ns_by_ordinal"]["pre"] <= row["t_minus_3_ns"] <= row["interface_counter_timestamp_ns_by_ordinal"]["pre"] + 100000000 and abs(row["interface_counter_timestamp_ns_by_ordinal"]["activation"] - row["cutover_ns"]) <= 100000000 and row["observation_end_ns"] <= row["interface_counter_timestamp_ns_by_ordinal"]["post"] <= row["observation_end_ns"] + 100000000 and set(row["process_cpu_timestamp_ns_by_ordinal"]) == {"endpoint_0", "endpoint_1", "parent"} and all(value["pre"] <= row["t_minus_3_ns"] and value["post"] >= row["observation_end_ns"] for value in row["process_cpu_timestamp_ns_by_ordinal"].values()); assert eligible is True; assert len(rows) == 1320 and manifest["row_count"] == 1320 and manifest["host_epoch"] == os.environ["HOST_EPOCH"] and manifest["git_commit"] == os.environ["GITHUB_SHA"] and environment["git_commit"] == os.environ["GITHUB_SHA"] and manifest["source_identity"] == contract["source_identity"]() and environment["source_identity"] == contract["source_identity"]() and manifest["implementation_sources"] == contract["implementation_sources"]() and environment["implementation_sources"] == contract["implementation_sources"]() and set(row["trial_id"] for row in rows) == set(planned); assert all(required <= set(row) and row["setup_status"] == "complete" and row["error_category"] in categories | {None} and all(row[field] is True for field in completeness) and all(type(row[field]) is int for field in counts) and 0 <= row["sent_payloads"] <= row["attempted_payloads"] <= row["scheduled_payloads"] == 800 and row["received_payloads"] >= 0 and set(row["interface_counter_by_ordinal"]) == {"pre", "activation", "post"} and all(row["interface_counter_by_ordinal"][key] for key in ("pre", "activation", "post")) and proof(row) and all(row[field] == value for field, value in topology.items()) for row in rows); assert all((row["mechanism"], row["arm"]) == (planned[row["trial_id"]]["mechanism"], planned[row["trial_id"]]["arm"]) for row in rows); pairs = {(item["mechanism"], item["arm"]) for item in planned.values()}; assert len(pairs) == 6 and all(sum((item["mechanism"], item["arm"]) == pair and item["exclusion_reason"] == "warmup" for item in planned.values()) == 20 and sum((item["mechanism"], item["arm"]) == pair and item["exclusion_reason"] is None for item in planned.values()) == 200 for pair in pairs); assert all(sum((item["mechanism"], item["arm"]) == pair and item["block_id"] == block for item in planned.values()) in {3, 4} for pair in pairs for block in range(66)); assert len({row["block_id"] for row in rows}) == 66; assert len(summary) == 6 and all({"setup_failure_count", "failure_rate", "measured_trial_count"} <= set(item) for item in summary); assert "publication_eligible.json" in manifest["files"] and all((output / name).is_file() and hashlib.sha256((output / name).read_bytes()).hexdigest() == digest for name, digest in manifest["files"].items()); assert "p99" not in json.dumps(summary).lower()'
      - name: Upload Q1 package
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: q1-full-${{ github.run_id }}
          path: ${{ runner.temp }}/q1-full
          if-no-files-found: warn
          retention-days: 30
